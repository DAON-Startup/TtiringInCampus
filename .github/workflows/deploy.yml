name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '배포를 진행하시겠습니까? (yes 입력)'
        required: true
        default: 'no'

jobs:
  deploy:
    if: github.event.inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Spring Boot JAR
        working-directory: ./backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      - name: Build Docker Image
        run: |
          docker build -t univ-notice-api:${{ github.sha }} ./backend
          docker tag univ-notice-api:${{ github.sha }} univ-notice-api:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/univ-notice
            
            # Pull latest code
            git pull origin main
            
            # Stop existing services
            docker-compose down
            
            # Rebuild and start
            docker-compose up -d --build
            
            # Wait for health check
            echo "Waiting for API server to start..."
            for i in {1..30}; do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "API server is healthy!"
                break
              fi
              echo "Attempt $i/30..."
              sleep 5
            done
            
            # Verify
            curl -sf http://localhost:8080/actuator/health || echo "WARNING: Health check failed"
            
            echo "Deployment complete!"

      - name: Notify on Success
        if: success()
        run: echo "✅ Deployment successful - ${{ github.sha }}"

      - name: Notify on Failure
        if: failure()
        run: echo "❌ Deployment failed - ${{ github.sha }}"