server {
    listen 80;
    server_name api.univnotice.kr;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.univnotice.kr;

    # SSL (Let's Encrypt가 자동 설정)
    ssl_certificate /etc/letsencrypt/live/api.univnotice.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.univnotice.kr/privkey.pem;

    # Spring Boot API
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # n8n (관리자만 접근 - IP 제한 권장)
    location /n8n/ {
        proxy_pass http://localhost:5678/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Actuator 외부 차단
    location /actuator/ {
        deny all;
        return 403;
    }

    # Internal API 외부 차단
    location /internal/ {
        deny all;
        return 403;
    }

    # 파일 업로드 제한
    client_max_body_size 10M;

    # GZIP 압축
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;
}